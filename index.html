const TEMPLATES = [ASSEMBLY_TEMPLATE, SANTECH_TEMPLATE];
const CHART_COLORS = ["#3b82f6","#22c55e","#f87171","#f59e0b","#a78bfa","#34d399"];
const PIE_COLORS = { accept:"#22c55e", reject:"#f87171", na:"#94a3b8", pending:"#1e293b" };

const nowStr = () => new Date().toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const genId  = () => Math.random().toString(36).slice(2,9);

const initData = () => {
  const d = {};
  TEMPLATES.forEach(t => {
    d[t.id] = {};
    t.sections.forEach(s => s.items.forEach(i => { d[t.id][i.id] = {status:null,note:"",inspector:null,time:null}; }));
  });
  return d;
};

const getStats = (tplId, cabinData) => {
  const tpl = TEMPLATES.find(t => t.id === tplId);
  if (!tpl) return {total:0,accepted:0,rejected:0,na:0,pending:0};
  const all = tpl.sections.flatMap(s => s.items);
  let accepted=0, rejected=0, na=0;
  all.forEach(i => {
    const s = cabinData?.[tplId]?.[i.id]?.status;
    if (s==="accept") accepted++;
    else if (s==="reject") rejected++;
    else if (s==="na") na++;
  });
  return {total:all.length, accepted, rejected, na, pending:all.length-accepted-rejected-na};
};

<script>
// ─── REACT APP ────────────────────────────────────────────────────────────────
const { useState, useEffect, useMemo } = React;

  const cabin = cabins.find(c => c.id === selCabin) || null;

    cabin?.data?.[phaseId]?.[itemId] || {status:null,note:"",inspector:null,time:null};

    setCabins(prev => prev.map(c => c.id !== selCabin ? c : {

    setCreateModal(false); setNewMarker(""); setNewDesc("");
    setSelCabin(nc.id); setPhase("assembly"); setPage("cabins");

  const deleteCabin = (id) => {

  const analytics = useMemo(() => {
    if (!cabins.length) return null;
    let totalItems=0, totalAccepted=0, totalRejected=0, totalNa=0;
    const byInspector = {};
    const cabinRows = cabins.map(c => {
      const as = getStats("assembly", c.data);
      const ss = getStats("santech",  c.data);
      const tot = as.total + ss.total;
      const done = as.accepted+as.rejected+as.na + ss.accepted+ss.rejected+ss.na;
      totalItems    += tot;
      totalAccepted += as.accepted + ss.accepted;
      totalRejected += as.rejected + ss.rejected;
      totalNa       += as.na + ss.na;
      TEMPLATES.forEach(t => {
        t.sections.forEach(sec => sec.items.forEach(item => {
          const d = c.data?.[t.id]?.[item.id];
          if (d?.inspector && d.status) {
            byInspector[d.inspector] = (byInspector[d.inspector]||0) + 1;
          }
        }));
      });
      return {
        id:c.id, marker:c.marker,
        aPct: Math.round(((as.accepted+as.rejected+as.na)/Math.max(as.total,1))*100),
        sPct: Math.round(((ss.accepted+ss.rejected+ss.na)/Math.max(ss.total,1))*100),
        overallPct: tot>0 ? Math.round((done/tot)*100) : 0,

    });

      const as = getStats("assembly",c.data);
      const ss = getStats("santech", c.data);
      return { name:c.marker,
        "Сборка":  Math.round(((as.accepted+as.rejected+as.na)/Math.max(as.total,1))*100),
        "Отделка": Math.round(((ss.accepted+ss.rejected+ss.na)/Math.max(ss.total,1))*100),

    });
    const inspData = Object.entries(byInspector).map(([id,cnt]) => ({
      user: getUserById(id), cnt

    return { totalItems, totalAccepted, totalRejected, totalNa,

      React.createElement("div", {className:"login-hint"}, "Введите своё имя точно как указано ниже"),
      React.createElement("div", {className:"field-label"}, "Ваше имя"),

          onKeyDown: e => e.key==="Enter" && handleLogin()

      ),
      loginError && React.createElement("div", {className:"login-error"}, loginError),
      React.createElement("button", {className:"btn-login", disabled:!nameInput.trim(), onClick:handleLogin}, "Войти"),
      React.createElement("div", {style:{marginTop:20}},
        React.createElement("div", {style:{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",color:"#334155",marginBottom:8}}, "Инспекторы ОТК"),
        React.createElement("div", {className:"login-names"},
          USERS.filter(u=>u.role==="inspector").map(u =>
            React.createElement("span", {key:u.id, className:"name-chip inspector",
              onClick:()=>{ setNameInput(u.name); setLoginError(""); }}, u.name)
          )
        ),
        React.createElement("div", {style:{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",color:"#334155",margin:"12px 0 8px"}}, "Мастера"),
        React.createElement("div", {className:"login-names"},

  // ── Main App ──
  return React.createElement("div", null,
