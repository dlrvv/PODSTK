<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ОТК · Контроль кабин</title>
    <!-- Загрузка React, ReactDOM, Babel и Recharts через CDN -->
    <script src="[unpkg.com](https://unpkg.com/react@18/umd/react.production.min.js)"></script>
    <script src="[unpkg.com](https://unpkg.com/react-dom@18/umd/react-dom.production.min.js)"></script>
    <script src="[unpkg.com](https://unpkg.com/@babel/standalone/babel.min.js)"></script>
    <script src="[unpkg.com](https://unpkg.com/prop-types@15.8.1/prop-types.min.js)"></script>
    <script src="[unpkg.com](https://unpkg.com/recharts/umd/Recharts.js)"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, PieChart, Pie, Cell } = Recharts;

        // Эмуляция window.storage для локального запуска
        if (!window.storage) {
            window.storage = {
                get: (key) => Promise.resolve({ value: localStorage.getItem(key) }),
                set: (key, val) => Promise.resolve(localStorage.setItem(key, val))
            };
        }

        // ─── ДАННЫЕ И ТЕМПЛЕЙТЫ ──────────────────────────────────────────────────
        const USERS = [
            { id: "amanat",  name: "Аманат",  role: "inspector" },
            { id: "sanzhar", name: "Санжар",  role: "inspector" },
            { id: "yelaman", name: "Еламан",  role: "inspector" },
            { id: "nurseit", name: "Нурсейт", role: "master"    },
            { id: "birlik",  name: "Бирлик",  role: "master"    },
        ];
        
        const getUserById = (id) => USERS.find(u => u.id === id) || { name: id || "Неизвестный", role: "unknown" };

        const ASSEMBLY_TEMPLATE = {
            id: "assembly", title: "Сборка кабины", icon: "🏗️",
            sections: [
                { id:"a1", title:"Этап 1 — Карта пола", items:[
                    {id:"a1_1",  text:"Соответствие используемых материалов (трубы, арматура)"},
                    {id:"a1_2",  text:"Геометрия металлокаркаса (габариты, диагонали)"},
                    {id:"a1_3",  text:"Проверка сварных соединений"},
                    {id:"a1_4",  text:"Грунтовка металла"},
                    {id:"a1_6",  text:"Заливка бетонной смеси по проекту"},
                    {id:"a1_10", text:"Гидроизоляция (2 слоя)"},
                ]},
                { id:"a2", title:"Этап 2 — Стены (Профиль/ГКЛВ)", items:[
                    {id:"a2_1",  text:"Геометрия каркаса стен (длина, ширина, диагональ)"},
                    {id:"a2_3",  text:"Антисептированный брусок в дверном проеме"},
                    {id:"a2_5",  text:"Шаг шурупов ГКЛВ (200–250 мм)"},
                    {id:"a2_8",  text:"Гидроизоляция мокрых зон"},
                ]},
                { id:"a3", title:"Этап 3 — Сборка СанТех кабины", items:[
                    {id:"a3_5",  text:"Замер внутренних и наружных габаритов"},
                    {id:"a3_7",  text:"Проверка углов (90°)"},
                    {id:"a3_10", text:"Установка потолка (шаг крепления)"},
                ]}
            ]
        };

        const SANTECH_TEMPLATE = {
            id: "santech", title: "Чистовая отделка", icon: "🔧",
            sections: [
                { id:"s1", title:"1. Плитка пол", items:[
                    {id:"s1_1",  text:"Типоразмер и цвет плитки"},
                    {id:"s1_10", text:"Уклон пола к трапу (не менее 1%)"},
                ]},
                { id:"s2", title:"2. Плитка стены", items:[
                    {id:"s2_2",  text:"Вертикальность укладки (2 мм на 2м)"},
                    {id:"s2_8",  text:"Простукивание (отсутствие пустот)"},
                ]},
                { id:"s7", title:"7. Итоговая приёмка", items:[
                    {id:"s7_1",  text:"★ Трещины, сколы, пустоты", critical:true},
                    {id:"s7_6",  text:"★ Работа смесителей (без течи)", critical:true},
                    {id:"s7_7",  text:"★ Финальный пролив системы", critical:true},
                ]}
            ]
        };

        const TEMPLATES = [ASSEMBLY_TEMPLATE, SANTECH_TEMPLATE];

        // ─── ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ─────────────────────────────────────────────
        const nowStr = () => new Date().toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
        const genId  = () => Math.random().toString(36).slice(2, 9);

        const initData = () => {
            const d = {};
            TEMPLATES.forEach(t => {
                d[t.id] = {};
                t.sections.forEach(s => s.items.forEach(i => { 
                    d[t.id][i.id] = { status: null, note: "", inspector: null, time: null }; 
                }));
            });
            return d;
        };

        const getStats = (tplId, cabinData) => {
            const tpl = TEMPLATES.find(t => t.id === tplId);
            if (!tpl) return { total: 0, accepted: 0, rejected: 0, na: 0, pending: 0 };
            const all = tpl.sections.flatMap(s => s.items);
            let accepted = 0, rejected = 0, na = 0;
            all.forEach(i => {
                const s = cabinData?.[tplId]?.[i.id]?.status;
                if (s === "accept") accepted++;
                else if (s === "reject") rejected++;
                else if (s === "na") na++;
            });
            return { total: all.length, accepted, rejected, na, pending: all.length - (accepted + rejected + na) };
        };

        const CHART_COLORS = ["#3b82f6", "#22c55e", "#f87171", "#f59e0b", "#a78bfa"];
        const PIE_COLORS = { accept: "#22c55e", reject: "#f87171", na: "#94a3b8", pending: "#1e293b" };

        // ─── ГЛАВНЫЙ КОМПОНЕНТ ───────────────────────────────────────────────────
        function App() {
            const [user, setUser] = useState(null);
            const [nameInput, setNameInput] = useState("");
            const [page, setPage] = useState("cabins"); 
            const [cabins, setCabins] = useState([]);
            const [selCabin, setSelCabin] = useState(null);
            const [activePhase, setPhase] = useState("assembly");
            const [openSecs, setOpenSecs] = useState({});
            const [createModal, setCreateModal] = useState(false);
            const [newMarker, setNewMarker] = useState("");
            const [loaded, setLoaded] = useState(false);

            useEffect(() => {
                window.storage.get("otk_v3_cabins").then(r => {
                    if (r?.value) setCabins(JSON.parse(r.value));
                    setLoaded(true);
                });
            }, []);

            useEffect(() => {
                if (loaded) window.storage.set("otk_v3_cabins", JSON.stringify(cabins));
            }, [cabins, loaded]);

            const cabin = useMemo(() => cabins.find(c => c.id === selCabin), [cabins, selCabin]);

            const handleLogin = () => {
                const match = USERS.find(u => u.name.toLowerCase() === nameInput.trim().toLowerCase());
                if (match) { setUser(match); setNameInput(""); }
                else alert("Имя не найдено");
            };

            const setStatus = (phaseId, itemId, status) => {
                setCabins(prev => prev.map(c => c.id !== selCabin ? c : {
                    ...c, data: { 
                        ...c.data, 
                        [phaseId]: { 
                            ...c.data[phaseId],
                            [itemId]: { ...c.data[phaseId][itemId], status, inspector: user.id, time: nowStr() } 
                        }
                    }
                }));
            };

            const createCabin = () => {
                if (!newMarker.trim()) return;
                const nc = { id: genId(), marker: newMarker.toUpperCase(), createdAt: nowStr(), data: initData() };
                setCabins([...cabins, nc]);
                setCreateModal(false); setNewMarker("");
            };

            const analytics = useMemo(() => {
                if (!cabins.length) return null;
                const barData = cabins.map(c => ({
                    name: c.marker,
                    "Прогресс": Math.round(((getStats("assembly", c.data).accepted + getStats("santech", c.data).accepted) / (ASSEMBLY_TEMPLATE.sections.flatMap(s=>s.items).length + SANTECH_TEMPLATE.sections.flatMap(s=>s.items).length)) * 100)
                }));
                return { barData };
            }, [cabins]);

            if (!user) return (
                <div className="login-screen">
                    <div className="login-box">
                        <h2>ОТК Вход</h2>
                        <input className="input" value={nameInput} onChange={e => setNameInput(e.target.value)} placeholder="Ваше имя" />
                        <button className="btn primary" onClick={handleLogin}>Войти</button>
                        <div className="hints">Попробуйте: Аманат, Санжар или Нурсейт</div>
                    </div>
                </div>
            );

            return (
                <div className="app-container">
                    <header className="main-header">
                        <div className="brand" onClick={() => setPage("cabins")}>🏗️ ОТК КОНТРОЛЬ</div>
                        <div className="user-info">{user.name} ({user.role})</div>
                    </header>

                    <nav className="nav-bar">
                        <button className={page === 'cabins' ? 'active' : ''} onClick={() => setPage('cabins')}>Кабины</button>
                        <button className={page === 'analytics' ? 'active' : ''} onClick={() => {setPage('analytics'); setSelCabin(null);}}>Аналитика</button>
                    </nav>

                    <main className="content">
                        {page === "cabins" && !selCabin && (
                            <div className="overview">
                                <h3>Список кабин</h3>
                                <div className="grid">
                                    {cabins.map(c => (
                                        <div key={c.id} className="card" onClick={() => setSelCabin(c.id)}>
                                            <div className="marker">{c.marker}</div>
                                            <div className="date">{c.createdAt}</div>
                                        </div>
                                    ))}
                                    {user.role === 'inspector' && (
                                        <div className="card add-card" onClick={() => setCreateModal(true)}>+ Новая кабина</div>
                                    )}
                                </div>
                            </div>
                        )}

                        {page === "cabins" && selCabin && cabin && (
                            <div className="checklist">
                                <button className="btn" onClick={() => setSelCabin(null)}>← Назад</button>
                                <h2>{cabin.marker}</h2>
                                <div className="phase-tabs">
                                    {TEMPLATES.map(t => (
                                        <button key={t.id} className={activePhase === t.id ? "active" : ""} onClick={() => setPhase(t.id)}>
                                            {t.icon} {t.title}
                                        </button>
                                    ))}
                                </div>
                                <div className="items">
                                    {TEMPLATES.find(t => t.id === activePhase).sections.map(sec => (
                                        <div key={sec.id} className="section">
                                            <h4>{sec.title}</h4>
                                            {sec.items.map(item => {
                                                const d = cabin.data[activePhase][item.id];
                                                return (
                                                    <div key={item.id} className={`item ${d.status}`}>
                                                        <div className="text">{item.text}</div>
                                                        <div className="actions">
                                                            <button onClick={() => setStatus(activePhase, item.id, 'accept')}>✓</button>
                                                            <button onClick={() => setStatus(activePhase, item.id, 'reject')}>✗</button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {page === "analytics" && analytics && (
                            <div className="analytics">
                                <h3>Аналитика прогресса</h3>
                                <div style={{width: '100%', height: 300}}>
                                    <ResponsiveContainer>
                                        <BarChart data={analytics.barData}>
                                            <XAxis dataKey="name" />
                                            <YAxis />
                                            <Tooltip />
                                            <Bar dataKey="Прогресс" fill="#3b82f6" />
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        )}
                    </main>

                    {createModal && (
                        <div className="modal-overlay">
                            <div className="modal">
                                <h3>Создать новую кабину</h3>
                                <input className="input" value={newMarker} onChange={e => setNewMarker(e.target.value)} placeholder="Номер кабины (напр. А-101)" />
                                <div className="modal-btns">
                                    <button className="btn" onClick={() => setCreateModal(false)}>Отмена</button>
                                    <button className="btn primary" onClick={createCabin}>Создать</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text-main: #f1f5f9;
            --primary: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text-main); }
        .login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--card); padding: 40px; border-radius: 12px; text-align: center; }
        .input { padding: 10px; width: 200px; border-radius: 6px; border: 1px solid #475569; margin-bottom: 10px; display: block; margin: 10px auto; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; background: #475569; color: white; }
        .btn.primary { background: var(--primary); }
        .main-header { padding: 15px 20px; background: var(--card); display: flex; justify-content: space-between; border-bottom: 1px solid #334155; }
        .nav-bar { display: flex; background: var(--card); padding: 0 20px; gap: 20px; }
        .nav-bar button { background: none; border: none; color: #94a3b8; padding: 15px 0; cursor: pointer; border-bottom: 2px solid transparent; }
        .nav-bar button.active { color: var(--primary); border-bottom-color: var(--primary); }
        .content { padding: 20px; max-width: 900px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 10px; cursor: pointer; text-align: center; }
        .add-card { border: 2px dashed #475569; background: none; }
        .phase-tabs { display: flex; gap: 10px; margin: 20px 0; }
        .phase-tabs button { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: var(--card); color: white; cursor: pointer; }
        .phase-tabs button.active { border-color: var(--primary); background: #1e3a8a; }
        .section { margin-top: 25px; }
        .item { background: var(--card); padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .item.accept { border-left: 4px solid var(--success); }
        .item.reject { border-left: 4px solid var(--danger); }
        .item .actions button { margin-left: 5px; padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; }
        .modal { background: var(--card); padding: 25px; border-radius: 12px; width: 300px; }
        .hints { font-size: 12px; color: #64748b; margin-top: 15px; }
    </style>
</body>
</html>
